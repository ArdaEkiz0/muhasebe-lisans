[package]
name = "muhasebe-lisans"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Muhasebe Paketi lisans/deneme karar cekirdegi: Ed25519 bilet/anahtar dogrulama + deneme karari. Python hattiyla birebir ayni sozlesme (bkz. docs/LISANS_SOZLESMESI.md)."
repository = "https://github.com/ArdaEkiz0/muhasebe-lisans"
keywords = ["lisans", "license", "trial", "ed25519"]
categories = ["cryptography"]

# Neden public: Finansal Hesaplayici'nin CI'i public repoda ve private git
# bagimliligini indiremiyor. Guvenlik kodun gizlilgine degil Ed25519 imzasina
# dayanir; bu crate YALNIZ dogrulama yapar, imza uretecek hicbir sey icermaz.

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
serde_json = "1"
sha2 = "0.10"
